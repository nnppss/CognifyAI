<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CognifyAI • QA</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Preload both videos -->
  <link rel="preload" as="video" href="{{ url_for('static', filename='intro-bg.mp4') }}">
  <link rel="preload" as="video" href="{{ url_for('static', filename='intro-bg-rev.mp4') }}">

  <link rel="stylesheet" href="{{ url_for('static', filename='landing.css') }}">
</head>

<body class="landing qa qa-chat">
  <!-- Page transition overlay -->
  <div id="pageTransition" class="page-transition active" aria-hidden="true"></div>
  <noscript><style>#pageTransition{display:none;}</style></noscript>

  <!-- Background video (boomerang + crossfade) -->
  <video
    id="bgVideoA"
    class="bg-video is-active"
    muted
    playsinline
    webkit-playsinline
    preload="auto"
    data-forward="{{ url_for('static', filename='intro-bg.mp4') }}"
    data-reverse="{{ url_for('static', filename='intro-bg-rev.mp4') }}"
  ></video>

  <video
    id="bgVideoB"
    class="bg-video"
    muted
    playsinline
    webkit-playsinline
    preload="auto"
    data-forward="{{ url_for('static', filename='intro-bg.mp4') }}"
    data-reverse="{{ url_for('static', filename='intro-bg-rev.mp4') }}"
  ></video>

  <div class="bg-overlay"></div>

  <main class="chat-shell">
    <header class="chat-header">
      <div class="chat-title">CognifyAI</div>

      <div class="chat-meta">
        {% if lecture_id %}
          <a class="pill" href="{{ url_for('summary_view', lecture_id=lecture_id) }}">Summary</a>
          <a class="pill" href="{{ url_for('notes_view', lecture_id=lecture_id) }}">Notes</a>
          <a class="pill" href="{{ url_for('quiz_view', lecture_id=lecture_id) }}">Quiz</a>
        {% endif %}
        <a class="pill" href="{{ url_for('index') }}">Change lecture</a>
      </div>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="chat-main">
      <div class="chat-content">
        <div id="chatScroll" class="chat-scroll">
          <div id="chatMessages" class="chat-messages">
            <div class="chat-empty">
              Your conversation will appear here.
            </div>
          </div>
        </div>
      </div>

      <aside class="chat-rail" aria-label="Chat controls">
        <button class="rail-btn" type="button" id="topKBtn">Top {{ (top_k|default(3)|int) }}</button>
        <button class="rail-btn" type="button" id="clearChatBtn">Clear chat</button>
      </aside>
    </div>

    <div class="composer-bar">
      <form id="qaForm" class="chatbox composer" method="POST" action="/qa">
        <input type="hidden" name="lecture_id" value="{{ lecture_id }}">
        <input type="hidden" name="src_url" value="{{ src_url }}">
        <input type="hidden" id="topKInput" name="top_k" value="{{ (top_k|default(3)|int) }}">

        <textarea
          id="qaInput"
          class="chat-input"
          name="question"
          placeholder="Ask a question about this lecture..."
          rows="1"
          required
          autocomplete="off"
          spellcheck="false"
        ></textarea>

        <button id="qaSendBtn" class="send-btn" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h13"></path>
            <path d="M12 5l7 7-7 7"></path>
          </svg>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>
    </div>
  </main>

  <!-- Boomerang crossfade controller -->
  <script src="{{ url_for('static', filename='bg-boomerang.js') }}"></script>

  <script>
    // Fade overlay out ASAP
    const overlay = document.getElementById('pageTransition');
    window.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => overlay && overlay.classList.remove('active'));
    }, { once: true });

    // Smooth fade when navigating away via same-origin links
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (!a) return;
      if (a.target === '_blank') return;

      const href = a.getAttribute('href');
      if (!href || href.startsWith('#')) return;

      const url = new URL(href, window.location.href);
      if (url.origin !== window.location.origin) return;

      e.preventDefault();
      overlay && overlay.classList.add('active');
      setTimeout(() => { window.location.href = url.href; }, 200);
    });

    // Boomerang + crossfade background
    setupBoomerangBackground('bgVideoA', 'bgVideoB');

    // Payload from server (used to append latest turn after reload)
    const payload = {
      lectureId: {{ ((lecture_id or "")|tojson) }},
      srcUrl: {{ ((src_url or "")|tojson) }},
      question: {{ ((question or "")|tojson) }},
      answer: {{ ((answer or "")|tojson) }},
      mode: {{ ((mode or "")|tojson) }},
      timestamp: {{ (timestamp if timestamp is not none else None)|tojson }},
      segments: {{ ((segments or [])|tojson) }},
    };

    const chatScroll = document.getElementById('chatScroll');
    const chatMessages = document.getElementById('chatMessages');
    const clearBtn = document.getElementById('clearChatBtn');
    const topKBtn = document.getElementById('topKBtn');
    const topKInput = document.getElementById('topKInput');

    let topKValue = Number(topKInput?.value || 3);
    if (!Number.isFinite(topKValue)) topKValue = 3;
    topKValue = Math.min(5, Math.max(1, Math.round(topKValue)));

    const syncTopK = () => {
      if (topKInput) topKInput.value = String(topKValue);
      if (topKBtn) topKBtn.textContent = `Top ${topKValue}`;
    };

    syncTopK();
    topKBtn?.addEventListener('click', () => {
      topKValue = topKValue >= 5 ? 1 : topKValue + 1;
      syncTopK();
    });

    const storageKey = `cognify_chat_${payload.lectureId || 'default'}`;

    function loadHistory(){
      try { return JSON.parse(localStorage.getItem(storageKey) || "[]"); }
      catch { return []; }
    }
    function saveHistory(hist){
      localStorage.setItem(storageKey, JSON.stringify(hist));
    }

    function escapeHtml(text){
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatInline(text){
      return escapeHtml(text)
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
    }

    function renderRichText(raw){
      const lines = String(raw || "").replace(/\r/g, "").split("\n");
      const html = [];
      let inUl = false;
      let inOl = false;

      const closeLists = () => {
        if (inUl) {
          html.push("</ul>");
          inUl = false;
        }
        if (inOl) {
          html.push("</ol>");
          inOl = false;
        }
      };

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
          closeLists();
          continue;
        }

        const heading = line.match(/^(#{1,4})\s+(.*)$/);
        if (heading) {
          closeLists();
          const level = Math.min(4, heading[1].length);
          html.push(`<h${level}>${formatInline(heading[2])}</h${level}>`);
          continue;
        }

        const ordered = line.match(/^\d+[.)]\s+(.*)$/);
        if (ordered) {
          if (!inOl) {
            closeLists();
            html.push("<ol>");
            inOl = true;
          }
          html.push(`<li>${formatInline(ordered[1])}</li>`);
          continue;
        }

        const bullet = line.match(/^[-*]\s+(.*)$/);
        if (bullet) {
          if (!inUl) {
            closeLists();
            html.push("<ul>");
            inUl = true;
          }
          html.push(`<li>${formatInline(bullet[1])}</li>`);
          continue;
        }

        const quote = line.match(/^>\s?(.*)$/);
        if (quote) {
          closeLists();
          html.push(`<blockquote>${formatInline(quote[1])}</blockquote>`);
          continue;
        }

        closeLists();
        html.push(`<p>${formatInline(line)}</p>`);
      }

      closeLists();
      return html.join("");
    }

    function toClock(seconds){
      const total = Math.max(0, Math.floor(Number(seconds) || 0));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      if (h > 0) {
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function makeJumpUrl(srcUrl, timestamp){
      if (!srcUrl || timestamp == null) return "";
      const t = Math.max(0, Math.floor(Number(timestamp)));
      try {
        const u = new URL(srcUrl);
        u.searchParams.set('t', `${t}s`);
        return u.toString();
      } catch {
        const sep = srcUrl.includes('?') ? '&' : '?';
        return `${srcUrl}${sep}t=${t}s`;
      }
    }

    function el(tag, className){
      const n = document.createElement(tag);
      if (className) n.className = className;
      return n;
    }

    function render(hist){
      chatMessages.innerHTML = "";

      if (!hist.length){
        const empty = el("div", "chat-empty");
        empty.textContent = "Your conversation will appear here.";
        chatMessages.appendChild(empty);
        return;
      }

      for (const turn of hist){
        // USER bubble
        const userMsg = el("div", "msg user");
        const userBubble = el("div", "bubble user");
        const userText = el("div", "bubble-text");
        userText.textContent = turn.q || "";
        userBubble.appendChild(userText);
        userMsg.appendChild(userBubble);
        chatMessages.appendChild(userMsg);

        // ASSISTANT bubble
        const asstMsg = el("div", "msg assistant");
        const asstBubble = el("div", "bubble assistant");
        const asstText = el("div", "bubble-text rich-text");
        asstText.innerHTML = renderRichText(turn.a || "");
        asstBubble.appendChild(asstText);

        const segs = Array.isArray(turn.segments) ? turn.segments : [];
        if (segs.length) {
          const drop = el("details", "segment-dropdown");
          const summary = el("summary", "segment-summary");
          summary.textContent = "Relevant segments to rewatch";
          drop.appendChild(summary);

          const list = el("div", "segment-list");
          segs.forEach((seg, idx) => {
            const start = Number(seg.start ?? seg.start_time ?? 0);
            const end = Number(seg.end ?? seg.end_time ?? start);
            const rank = Number(seg.rank || (idx + 1));
            const label = `[${rank}] ${toClock(start)}-${toClock(end)}`;
            const jumpUrl = makeJumpUrl(turn.srcUrl || payload.srcUrl, start);

            const item = el("div", "segment-item");
            if (jumpUrl) {
              const a = el("a", "segment-link");
              a.href = jumpUrl;
              a.target = "_blank";
              a.rel = "noopener";
              a.textContent = label;
              item.appendChild(a);
            } else {
              const span = el("span", "segment-link segment-link-disabled");
              span.textContent = label;
              item.appendChild(span);
            }
            list.appendChild(item);
          });

          drop.appendChild(list);
          asstBubble.appendChild(drop);
        }

        asstMsg.appendChild(asstBubble);
        chatMessages.appendChild(asstMsg);
      }
    }

    let chatHistory = loadHistory();

    // append latest server response as a turn
    if (payload.question && payload.answer){
      const turn = {
        q: payload.question,
        a: payload.answer,
        mode: payload.mode || "",
        timestamp: payload.timestamp,
        srcUrl: payload.srcUrl || "",
        segments: payload.segments || []
      };

      const last = chatHistory[chatHistory.length - 1];
      if (!last || last.q !== turn.q || last.a !== turn.a){
        chatHistory.push(turn);
        saveHistory(chatHistory);
      }
    }

    render(chatHistory);

    // scroll to bottom
    requestAnimationFrame(() => {
      chatScroll.scrollTop = chatScroll.scrollHeight;
    });

    // clear chat
    clearBtn?.addEventListener('click', () => {
      localStorage.removeItem(storageKey);
      chatHistory = [];
      render(chatHistory);
      requestAnimationFrame(() => chatScroll.scrollTop = chatScroll.scrollHeight);
    });

    // Composer UX
    const qaForm = document.getElementById('qaForm');
    const qaInput = document.getElementById('qaInput');
    const qaSendBtn = document.getElementById('qaSendBtn');

    const autoResize = () => {
      qaInput.style.height = '0px';
      qaInput.style.height = Math.min(160, qaInput.scrollHeight) + 'px';
    };

    if (qaInput){
      qaInput.addEventListener('input', autoResize);
      autoResize();

      qaInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey){
          e.preventDefault();
          qaForm.requestSubmit();
        }
      });
    }

    // smooth submit: sending state + fade overlay, then submit
    let sending = false;
    qaForm?.addEventListener('submit', (e) => {
      if (sending) return;
      sending = true;
      e.preventDefault();

      qaForm.classList.add('is-sending');
      qaInput?.setAttribute('readonly', 'readonly');
      if (qaSendBtn) qaSendBtn.disabled = true;

      overlay && overlay.classList.add('active');
      setTimeout(() => qaForm.submit(), 220);
    });
  </script>
</body>
</html>
